services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: file:../app/db.sqlite
      APP_URL: ${APP_URL:?Set APP_URL to the address used in your browser}
      APP_THEME: ${APP_THEME:-default}
    ports:
      - "6565:3000"
    volumes:
      - giftcard-data:/app/data
    restart: unless-stopped

volumes:
  giftcard-data:
